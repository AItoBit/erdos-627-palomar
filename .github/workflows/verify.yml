name: Palomar preflight

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
      - name: Build the complete proof with warnings as errors
        run: |
          set -o pipefail
          lake --wfail build Erdos627 Solution 2>&1 | tee proof-build.log
          lake build Challenge 2>&1 | tee challenge-build.log
          lake env lean -DwarningAsError=true Audit.lean 2>&1 | tee axioms.log
          python3 - <<'PY'
          import pathlib
          lines = pathlib.Path('axioms.log').read_text().splitlines()
          assert len(lines) == 5, lines
          assert all(line.endswith('[propext, Classical.choice, Quot.sound]') for line in lines), lines
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: lean-proof-evidence
          path: '*.log'
  palomar:
    needs: build
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
      request_id: erdos627-${{ github.run_id }}
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"comparator.json","authorization_relationship":"maintainer"}'
